<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Me</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 20% 30%, #2b1055 0%, transparent 35%),
                radial-gradient(circle at 80% 70%, #001eff 0%, transparent 35%),
                radial-gradient(circle at 60% 20%, #ff006a 0%, transparent 30%),
                #020207;

            background-size: 150% 150%;
            animation: backgroundMove 10s ease-in-out infinite alternate;
        }

        button {
            position: relative;

            padding: 22px 55px;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);

            color: white;

            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.15),
                0 0 60px rgba(100, 80, 255, 0.3);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        button::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: inherit;

            background: linear-gradient(90deg,
                    #ff006a,
                    #7b2cff,
                    #00d9ff,
                    #ff006a);

            background-size: 300%;

            z-index: -1;
            filter: blur(12px);
            opacity: 0.7;

            animation: glow 3s linear infinite;
        }

        button:hover {
            transform: scale(1.12);

            background: rgba(255, 255, 255, 0.14);

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.35),
                0 0 90px rgba(100, 80, 255, 0.6);
        }

        button:active {
            transform: scale(0.92) rotate(-2deg);
        }

        @keyframes glow {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }
    </style>
</head>

<body>

    <button id="button">click me</button>

    <script>
        const button = document.getElementById("button");

        button.addEventListener("click", () => {

            button.animate(
                [
                    { transform: "scale(1)" },
                    { transform: "scale(1.35) rotate(5deg)" },
                    { transform: "scale(0.85) rotate(-5deg)" },
                    { transform: "scale(1)" }
                ],
                {
                    duration: 500,
                    easing: "cubic-bezier(.2,.8,.2,1)"
                }
            );

            setTimeout(() => {
                window.location.href = "index.html";
            }, 5000);

        });
    </script>

</body>

</html>
