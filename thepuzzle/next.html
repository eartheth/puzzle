<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #020202;
        color: #d8d8d8;
        font-family: "Courier New", monospace;
    }

    body {
        position: relative;
        min-height: 100vh;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.045), transparent 28%),
            radial-gradient(circle at 80% 30%, rgba(255,255,255,.03), transparent 30%),
            radial-gradient(circle at 50% 90%, rgba(255,255,255,.022), transparent 32%),
            linear-gradient(135deg, #020202 0%, #080808 45%, #020202 100%);
    }

    /* animated aurora */
    .aurora,
    .aurora::before,
    .aurora::after {
        position: absolute;
        inset: -30%;
        content: "";
        border-radius: 50%;
        filter: blur(90px);
        opacity: .34;
        pointer-events: none;
    }

    .aurora {
        background: conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,.11) 70deg,
            transparent 130deg,
            rgba(255,255,255,.075) 220deg,
            transparent 300deg
        );
        animation: auroraSpin 18s linear infinite;
    }

    .aurora::before {
        background: radial-gradient(circle, rgba(255,255,255,.055), transparent 55%);
        animation: auroraFloat 10s ease-in-out infinite alternate;
    }

    .aurora::after {
        background: radial-gradient(circle, rgba(255,255,255,.04), transparent 55%);
        animation: auroraFloat2 13s ease-in-out infinite alternate;
    }

    @keyframes auroraSpin {
        to { transform: rotate(360deg) scale(1.07); }
    }

    @keyframes auroraFloat {
        from { transform: translate(-12%, -8%) scale(.8); }
        to   { transform: translate(15%, 12%) scale(1.05); }
    }

    @keyframes auroraFloat2 {
        from { transform: translate(15%, 10%) scale(1.0); }
        to   { transform: translate(-10%, -14%) scale(.82); }
    }

    /* moving perspective grid */
    .grid {
        position: absolute;
        left: -20%;
        right: -20%;
        bottom: -42%;
        height: 70%;
        background:
            linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
        background-size: 52px 52px;
        transform: perspective(500px) rotateX(63deg);
        transform-origin: center top;
        opacity: .34;
        animation: gridMove 2.8s linear infinite;
        pointer-events: none;
    }

    @keyframes gridMove {
        from { background-position: 0 0, 0 0; }
        to   { background-position: 0 52px, 52px 0; }
    }

    /* scanlines */
    .scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 80;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(255,255,255,.022),
                rgba(255,255,255,.022) 1px,
                transparent 1px,
                transparent 4px
            );
        mix-blend-mode: screen;
        animation: scanShift .22s linear infinite;
    }

    @keyframes scanShift {
        from { transform: translateY(0); }
        to   { transform: translateY(4px); }
    }

    /* vignette */
    .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 79;
        background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.78) 100%);
    }

    /* moving light beam */
    .beam {
        position: absolute;
        top: -30%;
        left: -35%;
        width: 38%;
        height: 160%;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.03),
            rgba(255,255,255,.13),
            rgba(255,255,255,.03),
            transparent
        );
        transform: rotate(18deg);
        filter: blur(10px);
        animation: beamMove 9s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes beamMove {
        0%   { transform: translateX(-30vw) rotate(18deg); opacity: 0; }
        20%  { opacity: 1; }
        50%  { opacity: .9; }
        80%  { opacity: 1; }
        100% { transform: translateX(160vw) rotate(18deg); opacity: 0; }
    }

    #particleCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
    }

    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(8px);
        opacity: .55;
        pointer-events: none;
        mix-blend-mode: screen;
    }

    .orb.one {
        width: 180px;
        height: 180px;
        left: 7%;
        top: 12%;
        background: radial-gradient(circle, rgba(255,255,255,.16), transparent 68%);
        animation: orb1 8s ease-in-out infinite alternate;
    }

    .orb.two {
        width: 240px;
        height: 240px;
        right: 3%;
        top: 9%;
        background: radial-gradient(circle, rgba(255,255,255,.11), transparent 68%);
        animation: orb2 11s ease-in-out infinite alternate;
    }

    .orb.three {
        width: 210px;
        height: 210px;
        left: 20%;
        bottom: 3%;
        background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
        animation: orb3 9s ease-in-out infinite alternate;
    }

    @keyframes orb1 {
        to { transform: translate(80px, 60px) scale(1.2); }
    }

    @keyframes orb2 {
        to { transform: translate(-110px, 80px) scale(.78); }
    }

    @keyframes orb3 {
        to { transform: translate(130px, -80px) scale(1.18); }
    }

    .scene {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        perspective: 1000px;
    }

    .login-shell {
        position: relative;
        width: min(430px, 92vw);
        transform-style: preserve-3d;
        animation: shellFloat 5s ease-in-out infinite;
    }

    @keyframes shellFloat {
        0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
        50% { transform: translateY(-8px) rotateX(.8deg) rotateY(-.8deg); }
    }

    /* animated outer glow */
    .login-shell::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 28px;
        background:
            conic-gradient(
                from var(--spin),
                #5f5f5f,
                #bdbdbd,
                #7a7a7a,
                #5f5f5f
            );
        filter: blur(13px);
        opacity: .7;
        z-index: -2;
        animation: borderSpin 4s linear infinite;
    }

    .login-shell::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 25px;
        background:
            conic-gradient(
                from var(--spin),
                rgba(255,255,255,.34),
                rgba(255,255,255,.18),
                rgba(255,255,255,.08),
                rgba(255,255,255,.34)
            );
        z-index: -1;
        animation: borderSpin 4s linear infinite;
    }

    @property --spin {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
    }

    @keyframes borderSpin {
        to { --spin: 360deg; }
    }

    .card {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        padding: 34px;
        background:
            linear-gradient(180deg, rgba(14,16,35,.86), rgba(5,7,19,.92));
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow:
            inset 0 1px rgba(255,255,255,.1),
            0 30px 70px rgba(0,0,0,.45);
    }

    .card::before {
        content: "";
        position: absolute;
        top: -30%;
        left: -60%;
        width: 60%;
        height: 180%;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.10),
            transparent
        );
        transform: rotate(18deg);
        animation: shine 5.6s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes shine {
        0%, 20% { left: -80%; }
        55%, 100% { left: 130%; }
    }

    .tiny {
        color: #5f5f5f;
        font: 11px/1.4 "Courier New", monospace;
        letter-spacing: 3px;
        margin-bottom: 10px;
        animation: tinyBlink 1.9s steps(2) infinite;
    }

    @keyframes tinyBlink {
        50% { opacity: .45; }
    }

    .title {
        position: relative;
        display: inline-block;
        margin: 0;
        font-size: clamp(34px, 7vw, 54px);
        line-height: .96;
        letter-spacing: -3px;
        font-weight: 800;
        background: linear-gradient(90deg, #fff, #d0d0d0, #9a9a9a, #fff);
        background-size: 250% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: titleFlow 4s linear infinite;
    }

    @keyframes titleFlow {
        to { background-position: 250% center; }
    }

    .title::before,
    .title::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
    }

    .title::before {
        color: #bdbdbd;
        clip-path: inset(0 0 55% 0);
        animation: glitchA 2.8s infinite;
    }

    .title::after {
        color: #7a7a7a;
        clip-path: inset(55% 0 0 0);
        animation: glitchB 3.1s infinite;
    }

    @keyframes glitchA {
        0%, 90%, 100% { transform: translate(0); opacity: 0; }
        92% { transform: translate(-4px, 1px); opacity: .75; }
        94% { transform: translate(5px, -1px); opacity: .55; }
        96% { transform: translate(-2px, 0); opacity: .7; }
    }

    @keyframes glitchB {
        0%, 87%, 100% { transform: translate(0); opacity: 0; }
        89% { transform: translate(4px, -1px); opacity: .65; }
        91% { transform: translate(-5px, 1px); opacity: .55; }
        94% { transform: translate(2px, 0); opacity: .7; }
    }

    .sub {
        margin: 14px 0 26px;
        color: #707070;
        font-size: 13px;
        line-height: 1.7;
    }

    .system-line {
        position: relative;
        min-height: 20px;
        margin-bottom: 20px;
        color: #626262;
        font: 11px/1.5 "Courier New", monospace;
        letter-spacing: .5px;
    }

    .system-line::after {
        content: "_";
        display: inline-block;
        margin-left: 3px;
        animation: cursorBlink .7s steps(1) infinite;
    }

    @keyframes cursorBlink {
        50% { opacity: 0; }
    }

    .field {
        position: relative;
        margin-bottom: 16px;
    }

    .field label {
        display: block;
        margin: 0 0 8px 3px;
        color: #656565;
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 700;
    }

    .input-wrap {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.10);
        transition: .22s;
    }

    .input-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.045),
            transparent
        );
        transform: translateX(-120%);
        animation: inputSweep 3.6s linear infinite;
        pointer-events: none;
    }

    @keyframes inputSweep {
        to { transform: translateX(120%); }
    }

    .input-wrap:focus-within {
        border-color: rgba(255,255,255,.32);
        box-shadow:
            0 0 0 3px rgba(255,255,255,.035),
            0 0 25px rgba(255,255,255,.055);
        transform: translateY(-1px) scale(1.006);
    }

    input {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 15px 46px 15px 15px;
        border: 0;
        outline: none;
        color: #f7f8ff;
        background: transparent;
        font: 14px "Courier New", monospace;
    }

    input::placeholder {

    }

    .icon {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #666666;
        z-index: 3;
        animation: iconPulse 2.5s ease-in-out infinite;
    }

    @keyframes iconPulse {
        50% {

            text-shadow: 0 0 12px rgba(100,170,255,.6);

    }

    .login-btn {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 0;
        border-radius: 14px;
        padding: 15px 18px;
        margin-top: 8px;
        cursor: pointer;
        color: #fff;
        font-weight: 800;
        letter-spacing: 2px;

        box-shadow:

            inset 0 1px rgba(255,255,255,.24);
        animation: btnFlow 3.2s linear infinite, btnPulse 2.2s ease-in-out infinite;
        transition: transform .18s;
    }

    .login-btn:hover {
        transform: translateY(-2px) scale(1.01);
    }

    .login-btn:active {
        transform: translateY(1px) scale(.995);
    }

    @keyframes btnFlow {
        to { background-position: 300% 0; }
    }

    @keyframes btnPulse {
        50% {
            box-shadow:
                0 12px 42px rgba(255,255,255,.09),
                0 0 28px rgba(255,255,255,.035),

    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,.5);
        transform: scale(0);
        animation: ripple .65s linear forwards;
        pointer-events: none;
    }

    @keyframes ripple {
        to {

    .status {

        margin-top: 15px;
        text-align: center;
        color: #747474;
        font: 12px/1.7 "Courier New", monospace;
    }

    .error {
        animation: errorShake .24s linear 2;
    }

    @keyframes errorShake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-8px) rotate(-.4deg); }
        50% { transform: translateX(8px) rotate(.4deg); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    .corner {
        position: absolute;
        width: 28px;
        height: 28px;
        opacity: .5;
    }

    .corner.tl {
        top: 12px; left: 12px;
        border-top: 1px solid #777777;
        border-left: 1px solid #777777;
    }

    .corner.tr {
        top: 12px; right: 12px;

    }

    .corner.bl {

        border-bottom: 1px solid #8a8a8a;
        border-left: 1px solid #8a8a8a;
    }

    .corner.br {
        bottom: 12px; right: 12px;
        border-bottom: 1px solid #666666;
        border-right: 1px solid #666666;
    }

    .success-screen {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        place-items: center;
        background: #020202;
        overflow: hidden;
    }

    .success-screen.active {
        display: grid;
        animation: successIn .55s ease both;
    }

    @keyframes successIn {
        from { opacity: 0; transform: scale(1.08); }
        to { opacity: 1; transform: scale(1); }
    }

    .success-ring {
        position: absolute;
        width: 220px;
        height: 220px;
        border: 2px solid rgba(255,255,255,.24);
        border-radius: 50%;
        animation: ringExpand 1.6s ease-out infinite;
    }

    .success-ring:nth-child(2) {
        animation-delay: .45s;
    }

    .success-ring:nth-child(3) {
        animation-delay: .9s;
    }

    @keyframes ringExpand {
        0% { transform: scale(.3); opacity: .8; }
        100% { transform: scale(5.5); opacity: 0; }
    }

    .success-text {
        position: relative;
        z-index: 4;
        text-align: center;
        font-family: "Courier New", monospace;
        animation: successFloat 2s ease-in-out infinite;
    }

    .success-text h2 {
        margin: 0;
        font-size: clamp(36px, 8vw, 80px);
        letter-spacing: -3px;
        background: linear-gradient(90deg, #fff, #c8c8c8, #8e8e8e, #fff);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: titleFlow 2.8s linear infinite;
    }

    .success-text p {
        color: #6f6f6f;
        letter-spacing: 4px;
        font-size: 11px;
    }

    @keyframes successFloat {
        50% { transform: translateY(-8px) scale(1.02); }
    }

    .flash {
        position: fixed;
        inset: 0;
        z-index: 150;
        background: white;
        opacity: 0;
        pointer-events: none;
    }

    .flash.go {
        animation: flash .8s ease-out;
    }

    @keyframes flash {
        0% { opacity: 0; }
        10% { opacity: .95; }
        100% { opacity: 0; }
    }

    .floating-code {
        position: absolute;
        color: rgba(255,255,255,.045);
        font: 11px "Courier New", monospace;
        white-space: nowrap;
        pointer-events: none;
        animation: codeFloat linear infinite;
    }

    @keyframes codeFloat {
        from { transform: translateY(110vh); }
        to { transform: translateY(-120vh); }
    }

    @media (max-width: 560px) {
        .card {
            padding: 28px 22px;
        }
    }
</style>
</head>

<script>
/* =========================================================
   PARTICLES
========================================================= */

const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");

let w = 0;
let h = 0;
let particles = [];

function resizeCanvas() {
    w = canvas.width = innerWidth * devicePixelRatio;
    h = canvas.height = innerHeight * devicePixelRatio;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    particles = [];

    const count = Math.min(110, Math.floor(innerWidth / 10));

    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: (Math.random() * 1.6 + .3) * devicePixelRatio,
            vx: (Math.random() - .5) * .18 * devicePixelRatio,
            vy: (Math.random() - .5) * .18 * devicePixelRatio,
            a: Math.random() * .55 + .12
        });
    }
}

function drawParticles() {
    ctx.clearRect(0, 0, w, h);

    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,220,220,${p.a})`;
        ctx.fill();
    }

    /* subtle particle links */
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];
            const b = particles[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 95 * devicePixelRatio) {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = `rgba(170,170,170,${.06 * (1 - dist / (95 * devicePixelRatio))})`;
                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(drawParticles);
}

addEventListener("resize", resizeCanvas);
resizeCanvas();
drawParticles();

const codeBits = [

for (let i = 0; i < 20; i++) {

    el.className = "floating-code";

}


/* =========================================================
   MOUSE PARALLAX
========================================================= */

const shell = document.getElementById("loginShell");

document.addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth - .5);
    const y = (e.clientY / innerHeight - .5);

    shell.style.transform =

document.addEventListener("mouseleave", () => {
    shell.style.transform = "";
});


/* =========================================================
   SYSTEM TYPEWRITER
========================================================= */

const systemLine = document.getElementById("systemLine");

const messages = [
    "INITIALIZING AUTHENTICATION MATRIX...",
    "SCANNING LOCAL IDENTITY CACHE...",
    "HANDSHAKE WITH UNKNOWN LAYER COMPLETE.",
    "WAITING FOR USER CREDENTIALS..."
];

let mIndex = 0;

function typeMessage() {
    const message = messages[mIndex % messages.length];
    let i = 0;

    systemLine.textContent = "";

    const timer = setInterval(() => {
        systemLine.textContent += message[i] || "";
        i++;

        if (i > message.length) {
            clearInterval(timer);

            setTimeout(() => {
                mIndex++;
                typeMessage();
            }, 1300);
        }
    }, 28);
}

typeMessage();


/* =========================================================
   RIPPLE BUTTON
========================================================= */

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", function(e) {
    const rect = this.getBoundingClientRect();

    const ripple = document.createElement("span");
    ripple.className = "ripple";

    const size = Math.max(rect.width, rect.height);

    ripple.style.width = size + "px";
    ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top = (e.clientY - rect.top - size / 2) + "px";

    this.appendChild(ripple);

    setTimeout(() => ripple.remove(), 700);

    login();
});


/* =========================================================
   LOGIN
========================================================= */

const password = document.getElementById("password");
const status = document.getElementById("status");
const card = document.getElementById("card");
const successScreen = document.getElementById("successScreen");
const flash = document.getElementById("flash");

function login() {
    const p = password.value;

    status.textContent = "VERIFYING...";

    setTimeout(() => {
        if (p.trim().toLowerCase() === "zindea_cubu") {

            status.textContent = "SIGNATURE ACCEPTED.";

            flash.classList.remove("go");
            void flash.offsetWidth;
            flash.classList.add("go");

            setTimeout(() => {
                successScreen.classList.add("active");

                setTimeout(() => {
                    window.location.href = "idk.html";
                }, 1200);
            }, 240);

        } else {

            status.textContent = "ACCESS DENIED // INVALID CREDENTIALS";

            card.classList.remove("error");
            void card.offsetWidth;
            card.classList.add("error");

            password.value = "";

            /* temporary red distortion */
            document.body.animate(
                [
                    { filter: "none" },
                    { filter: "grayscale(1) invert(.12) contrast(2.2) brightness(1.25)" },
                    { filter: "none" }
                ],
                {
                    duration: 420,
                    easing: "steps(3)"
                }
            );
        }
    }, 700);
}

password.addEventListener("keydown", e => {
    if (e.key === "Enter") loginBtn.click();
});



/* =========================================================
   RANDOM MICRO-GLITCHES
========================================================= */

setInterval(() => {
    if (Math.random() < .16) {
        card.animate(
            [
                { transform: "translate(0,0)" },
                { transform: "translate(-2px,1px)" },
                { transform: "translate(3px,-1px)" },
                { transform: "translate(0,0)" }
            ],
            {
                duration: 130,
                easing: "steps(3)"
            }
        );
    }
}, 900);


/* =========================================================
   RANDOM BACKGROUND FLICKER
========================================================= */

setInterval(() => {
    if (Math.random() < .08) {
        document.body.animate(
            [
                { filter: "brightness(1)" },
                { filter: "brightness(1.18)" },
                { filter: "brightness(.95)" },
                { filter: "brightness(1)" }
            ],
            { duration: 180 }
        );
    }
}, 700);

</script>
