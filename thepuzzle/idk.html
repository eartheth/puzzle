<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE IMPOSSIBLE PUZZLE // CIPHER</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020202;
        color: #d8d8d8;
        font-family: "Courier New", monospace;
    }

    body {
        position: relative;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle at 20% 20%, rgba(255,255,255,.045), transparent 28%),
            radial-gradient(circle at 80% 30%, rgba(255,255,255,.03), transparent 30%),
            radial-gradient(circle at 50% 90%, rgba(255,255,255,.022), transparent 32%),
            linear-gradient(135deg, #020202 0%, #080808 45%, #020202 100%);
    }

    .aurora,
    .aurora::before,
    .aurora::after {
        position: absolute;
        inset: -30%;
        content: "";
        border-radius: 50%;
        filter: blur(90px);
        opacity: .34;
        pointer-events: none;
    }

    .aurora {
        background: conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,.11) 70deg,
            transparent 130deg,
            rgba(255,255,255,.075) 220deg,
            transparent 300deg
        );
        animation: auroraSpin 18s linear infinite;
    }

    .aurora::before {
        background: radial-gradient(circle, rgba(255,255,255,.055), transparent 55%);
        animation: auroraFloat 10s ease-in-out infinite alternate;
    }

    .aurora::after {
        background: radial-gradient(circle, rgba(255,255,255,.04), transparent 55%);
        animation: auroraFloat2 13s ease-in-out infinite alternate;
    }

    @keyframes auroraSpin {
        to { transform: rotate(360deg) scale(1.07); }
    }

    @keyframes auroraFloat {
        from { transform: translate(-12%, -8%) scale(.8); }
        to   { transform: translate(15%, 12%) scale(1.05); }
    }

    @keyframes auroraFloat2 {
        from { transform: translate(15%, 10%) scale(1.0); }
        to   { transform: translate(-10%, -14%) scale(.82); }
    }

    .grid {
        position: absolute;
        left: -20%;
        right: -20%;
        bottom: -42%;
        height: 70%;
        background:
            linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
        background-size: 52px 52px;
        transform: perspective(500px) rotateX(63deg);
        transform-origin: center top;
        opacity: .34;
        animation: gridMove 2.8s linear infinite;
        pointer-events: none;
    }

    @keyframes gridMove {
        from { background-position: 0 0, 0 0; }
        to   { background-position: 0 52px, 52px 0; }
    }

    .scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(255,255,255,.022),
                rgba(255,255,255,.022) 1px,
                transparent 1px,
                transparent 4px
            );
        mix-blend-mode: screen;
        animation: scanShift .22s linear infinite;
    }

    @keyframes scanShift {
        from { transform: translateY(0); }
        to   { transform: translateY(4px); }
    }

    .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 49;
        background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.82) 100%);
    }

    .wrapper {
        position: relative;
        z-index: 10;
        width: min(720px, 88vw);
        text-align: center;
        animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }

    .image-shell {
        position: relative;
        display: inline-block;
        max-width: 100%;
        padding: 2px;
        border-radius: 18px;
        background:
            conic-gradient(
                from var(--spin),
                #5f5f5f,
                #bdbdbd,
                #7a7a7a,
                #5f5f5f
            );
        box-shadow:
            0 0 28px rgba(255,255,255,.07),
            0 28px 70px rgba(0,0,0,.55);
        animation: borderSpin 4s linear infinite;
    }

    @property --spin {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
    }

    @keyframes borderSpin {
        to { --spin: 360deg; }
    }

    .image-shell::before {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 28px;
        background:
            conic-gradient(
                from var(--spin),
                rgba(255,255,255,.16),
                rgba(255,255,255,.04),
                rgba(255,255,255,.12),
                rgba(255,255,255,.03)
            );
        filter: blur(22px);
        opacity: .55;
        z-index: -1;
        animation: borderSpin 4s linear infinite;
    }

    img {
        display: block;
        max-width: min(680px, 84vw);
        max-height: 68vh;
        width: auto;
        height: auto;
        border-radius: 16px;
        background: #050505;
        user-select: none;
        -webkit-user-drag: none;
    }

    .words {
        margin-top: 22px;
        font-size: clamp(13px, 2vw, 18px);
        font-weight: 700;
        letter-spacing: 4px;
        color: #8b8b8b;
        text-shadow: 0 0 16px rgba(255,255,255,.08);
        animation: textFlicker 3.5s infinite;
    }

    .dot {
        display: inline-block;
        margin: 0 12px;
        color: #555;
        animation: dotPulse 1.8s ease-in-out infinite;
    }

    .dot:nth-of-type(2) { animation-delay: .3s; }
    .dot:nth-of-type(3) { animation-delay: .6s; }

    @keyframes dotPulse {
        50% {
            color: #cfcfcf;
            text-shadow: 0 0 12px rgba(255,255,255,.25);
        }
    }

    @keyframes textFlicker {
        0%, 94%, 100% { opacity: 1; transform: translateX(0); }
        95% { opacity: .62; transform: translateX(-1px); }
        96% { opacity: .9; transform: translateX(1px); }
        97% { opacity: .72; }
    }

    @media (max-width: 560px) {
        .words {
            letter-spacing: 2px;
        }

        .dot {
            margin: 0 6px;
        }
    }
</style>
</head>

<body>

<div class="aurora"></div>
<div class="grid"></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="wrapper">
    <div class="image-shell">
        <img src="cipher.png" alt="">
    </div>

    <div class="words">
        GEO<span class="dot">·</span>NIGHTMARE<span class="dot">·</span>PHANTOM<span class="dot">·</span>LSB
    </div>
</div>

</body>
</html>
