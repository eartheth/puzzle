<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE IMPOSSIBLE PUZZLE // CIPHER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #020202;
            color: #d8d8d8;

            font-family: "Courier New", monospace;
        }

        body {
            position: relative;

            display: grid;
            place-items: center;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(255, 255, 255, .045),
                    transparent 28%),
                radial-gradient(circle at 80% 30%,
                    rgba(255, 255, 255, .03),
                    transparent 30%),
                radial-gradient(circle at 50% 90%,
                    rgba(255, 255, 255, .022),
                    transparent 32%),
                linear-gradient(135deg,
                    #020202 0%,
                    #080808 45%,
                    #020202 100%);
        }


        /* =========================
       AURORA
       ========================= */

        .aurora,
        .aurora::before,
        .aurora::after {
            position: absolute;
            inset: -30%;

            content: "";

            border-radius: 50%;

            filter: blur(90px);

            opacity: .34;

            pointer-events: none;
        }

        .aurora {
            background:
                conic-gradient(from 0deg,
                    transparent 0deg,
                    rgba(255, 255, 255, .11) 70deg,
                    transparent 130deg,
                    rgba(255, 255, 255, .075) 220deg,
                    transparent 300deg);

            animation:
                auroraSpin 18s linear infinite;
        }

        .aurora::before {
            background:
                radial-gradient(circle,
                    rgba(255, 255, 255, .055),
                    transparent 55%);

            animation:
                auroraFloat 10s ease-in-out infinite alternate;
        }

        .aurora::after {
            background:
                radial-gradient(circle,
                    rgba(255, 255, 255, .04),
                    transparent 55%);

            animation:
                auroraFloat2 13s ease-in-out infinite alternate;
        }

        @keyframes auroraSpin {
            to {
                transform:
                    rotate(360deg) scale(1.07);
            }
        }

        @keyframes auroraFloat {
            from {
                transform:
                    translate(-12%, -8%) scale(.8);
            }

            to {
                transform:
                    translate(15%, 12%) scale(1.05);
            }
        }

        @keyframes auroraFloat2 {
            from {
                transform:
                    translate(15%, 10%) scale(1);
            }

            to {
                transform:
                    translate(-10%, -14%) scale(.82);
            }
        }


        /* =========================
       GRID
       ========================= */

        .grid {
            position: absolute;

            left: -20%;
            right: -20%;
            bottom: -42%;

            height: 70%;

            background:
                linear-gradient(rgba(255, 255, 255, .06) 1px,
                    transparent 1px),
                linear-gradient(90deg,
                    rgba(255, 255, 255, .06) 1px,
                    transparent 1px);

            background-size: 52px 52px;

            transform:
                perspective(500px) rotateX(63deg);

            transform-origin: center top;

            opacity: .34;

            animation:
                gridMove 2.8s linear infinite;

            pointer-events: none;
        }

        @keyframes gridMove {
            from {
                background-position:
                    0 0,
                    0 0;
            }

            to {
                background-position:
                    0 52px,
                    52px 0;
            }
        }


        /* =========================
       SCANLINES
       ========================= */

        .scanlines {
            position: absolute;
            inset: 0;

            pointer-events: none;

            z-index: 50;

            background:
                repeating-linear-gradient(0deg,
                    rgba(255, 255, 255, .022),
                    rgba(255, 255, 255, .022) 1px,
                    transparent 1px,
                    transparent 4px);

            mix-blend-mode: screen;

            animation:
                scanShift .22s linear infinite;
        }

        @keyframes scanShift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(4px);
            }
        }


        /* =========================
       VIGNETTE
       ========================= */

        .vignette {
            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 49;

            background:
                radial-gradient(circle at center,
                    transparent 35%,
                    rgba(0, 0, 0, .82) 100%);
        }


        /* =========================
       WRAPPER
       ========================= */

        .wrapper {
            position: relative;

            z-index: 10;

            width: min(720px, 88vw);

            text-align: center;

            animation:
                float 5s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================
       IMAGE
       ========================= */

        .image-shell {
            position: relative;

            display: inline-block;

            max-width: 100%;

            padding: 2px;

            border-radius: 18px;

            background:
                conic-gradient(from var(--spin),
                    #5f5f5f,
                    #bdbdbd,
                    #7a7a7a,
                    #5f5f5f);

            box-shadow:
                0 0 28px rgba(255, 255, 255, .07),
                0 28px 70px rgba(0, 0, 0, .55);

            animation:
                borderSpin 4s linear infinite;
        }

        @property --spin {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes borderSpin {
            to {
                --spin: 360deg;
            }
        }

        .image-shell::before {
            content: "";

            position: absolute;

            inset: -18px;

            border-radius: 28px;

            background:
                conic-gradient(from var(--spin),
                    rgba(255, 255, 255, .16),
                    rgba(255, 255, 255, .04),
                    rgba(255, 255, 255, .12),
                    rgba(255, 255, 255, .03));

            filter: blur(22px);

            opacity: .55;

            z-index: -1;

            animation:
                borderSpin 4s linear infinite;
        }

        .cipher-image {
            display: block;

            max-width:
                min(680px, 84vw);

            max-height: 68vh;

            width: auto;
            height: auto;

            border-radius: 16px;

            background: #050505;

            user-select: none;
            -webkit-user-select: none;

            -webkit-user-drag: none;

            cursor: default;
        }


        /* =========================
       WORDS
       ========================= */

        .words {
            margin-top: 22px;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            font-size:
                clamp(13px, 2vw, 18px);

            font-weight: 700;

            letter-spacing: 4px;

            color: #8b8b8b;

            text-shadow:
                0 0 16px rgba(255, 255, 255, .08);

            animation:
                textFlicker 3.5s infinite;
        }

        .word-holder {
            position: relative;

            display: inline-flex;

            flex-direction: column;

            align-items: center;
        }

        .word {
            display: inline-block;

            white-space: nowrap;
        }

        .dot {
            display: inline-block;

            margin: 0 12px;

            color: #555;

            animation:
                dotPulse 1.8s ease-in-out infinite;
        }


        /* =========================
       NIGHTMARE HINT
       ========================= */

        .nightmare-hint {
            display: none;

            margin-top: 10px;

            width: 24px;
            height: 24px;

            border:
                1px solid #626262;

            background:
                rgba(255, 255, 255, .015);

            box-shadow:
                0 0 8px rgba(255, 255, 255, .06),
                inset 0 0 7px rgba(255, 255, 255, .025);

            animation:
                hintAppear .7s ease forwards;
        }


        /* =========================
       PHANTOM HINT
       ========================= */

        .phantom-hint {
            display: none;

            margin-top: 11px;

            font-size: 8px;

            font-weight: normal;

            letter-spacing: 1.4px;

            color: #666;

            text-shadow:
                0 0 7px rgba(255, 255, 255, .06);

            animation:
                hintAppear .7s ease forwards;
        }


        /* =========================
       URL HINT
       ========================= */

        .url-hint {
            margin-top: 18px;

            font-size: 9px;

            font-weight: normal;

            letter-spacing: 1px;

            color: #3d3d3d;

            opacity: .7;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =========================
       DOWNLOAD BUTTON
       ========================= */

        .download-image {
            margin-top: 10px;

            padding:
                7px 13px;

            border:
                1px solid #3f3f3f;

            border-radius: 4px;

            outline: none;

            background:
                rgba(5, 5, 5, .72);

            color: #5a5a5a;

            font-family:
                "Courier New",
                monospace;

            font-size: 8px;

            letter-spacing: 1.4px;

            cursor: pointer;

            transition:
                all .25s ease;
        }

        .download-image:hover {
            color: #aaa;

            border-color: #777;

            background:
                rgba(15, 15, 15, .9);

            box-shadow:
                0 0 10px rgba(255, 255, 255, .06);
        }

        .download-image:active {
            transform: scale(.96);
        }


        /* =========================
       SECRET TIMER OVERLAY
       ========================= */

        .secret-timer {
            position: fixed;

            inset: 0;

            z-index: 999999;

            display: none;

            align-items: center;
            justify-content: center;

            pointer-events: none;
        }

        .secret-timer.show {
            display: flex;
        }

        .timer-box {
            width: 170px;

            padding:
                22px 18px;

            border:
                1px solid #555;

            border-radius: 8px;

            background:
                rgba(0, 0, 0, .97);

            box-shadow:
                0 0 35px rgba(255, 255, 255, .10),
                0 0 120px rgba(0, 0, 0, .95);

            text-align: center;

            animation:
                timerAppear .25s ease forwards;
        }

        .timer-label {
            margin-bottom: 8px;

            color: #666;

            font-size: 8px;

            letter-spacing: 2px;
        }

        .timer-number {
            color: #d0d0d0;

            font-size: 42px;

            line-height: 1;

            font-weight: bold;

            letter-spacing: 2px;

            text-shadow:
                0 0 15px rgba(255, 255, 255, .18);
        }

        .timer-line {
            width: 100%;

            height: 2px;

            margin-top: 14px;

            overflow: hidden;

            background:
                #1c1c1c;
        }

        .timer-progress {
            width: 100%;
            height: 100%;

            background:
                #888;

            transform-origin:
                left center;
        }

        .secret-timer.show .timer-progress {
            animation:
                countdownLine 10s linear forwards;
        }

        @keyframes timerAppear {
            from {
                opacity: 0;

                transform:
                    scale(.88);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }

        @keyframes countdownLine {
            from {
                transform:
                    scaleX(1);
            }

            to {
                transform:
                    scaleX(0);
            }
        }


        /* =========================
       SHOW HINTS
       ========================= */

        body.show-hints .nightmare-hint {
            display: block;
        }

        body.show-hints .phantom-hint {
            display: block;
        }

        body.show-hints .url-hint {
            opacity: .2;
        }


        /* =========================
       ANIMATIONS
       ========================= */

        @keyframes hintAppear {
            from {
                opacity: 0;

                transform:
                    translateY(-5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        @keyframes dotPulse {
            50% {
                color: #cfcfcf;

                text-shadow:
                    0 0 12px rgba(255, 255, 255, .25);
            }
        }

        @keyframes textFlicker {

            0%,
            94%,
            100% {
                opacity: 1;

                transform:
                    translateX(0);
            }

            95% {
                opacity: .62;

                transform:
                    translateX(-1px);
            }

            96% {
                opacity: .9;

                transform:
                    translateX(1px);
            }

            97% {
                opacity: .72;
            }
        }


        /* =========================
       MOBILE
       ========================= */

        @media (max-width: 560px) {

            .words {
                letter-spacing: 2px;
            }

            .dot {
                margin: 0 6px;
            }

            .phantom-hint {
                font-size: 6px;

                letter-spacing: .7px;
            }

        }
    </style>

</head>

<body>


    <!-- BACKGROUND -->

    <div class="aurora"></div>

    <div class="grid"></div>

    <div class="vignette"></div>

    <div class="scanlines"></div>



    <!-- =========================
     SECRET TIMER
     ========================= -->

    <div class="secret-timer" id="secretTimer">

        <div class="timer-box">

            <div class="timer-label">
                REDIRECTING
            </div>

            <div class="timer-number" id="timerNumber">
                10
            </div>

            <div class="timer-line">

                <div class="timer-progress" id="timerProgress"></div>

            </div>

        </div>

    </div>



    <!-- =========================
     MAIN CONTENT
     ========================= -->

    <div class="wrapper">


        <!-- IMAGE -->

        <div class="image-shell">

            <img class="cipher-image" id="cipherImage" src="cipher.png" alt="Cipher" draggable="false">

        </div>



        <!-- WORDS -->

        <div class="words">


            <!-- GEO -->

            <div class="word-holder">

                <span class="word">
                    GEO
                </span>

            </div>


            <span class="dot">
                ·
            </span>



            <!-- NIGHTMARE -->

            <div class="word-holder">

                <span class="word">
                    NIGHTMARE
                </span>

                <div class="nightmare-hint">
                </div>

            </div>


            <span class="dot">
                ·
            </span>



            <!-- PHANTOM -->

            <div class="word-holder">

                <span class="word">
                    PHANTOM
                </span>

                <div class="phantom-hint">
                    TRANSPOSITION
                </div>

            </div>


            <span class="dot">
                ·
            </span>



            <!-- LSB -->

            <div class="word-holder">

                <span class="word">
                    LSB
                </span>

            </div>


        </div>



        <!-- URL CLUE -->

        <div class="url-hint">
            ?hint=true
        </div>



        <!-- DOWNLOAD IMAGE -->

        <button class="download-image" id="downloadButton" type="button">
            DOWNLOAD IMAGE
        </button>


    </div>



    <script>

        /* =========================================
           SETTINGS
           ========================================= */

        const REQUIRED_CLICKS = 15;

        const REDIRECT_SECONDS = 10;

        const INACTIVITY_TIME = 10000;

        const REDIRECT_URL = "secret.html";


        /* =========================================
           ELEMENTS
           ========================================= */

        const cipherImage =
            document.getElementById(
                "cipherImage"
            );

        const secretTimer =
            document.getElementById(
                "secretTimer"
            );

        const timerNumber =
            document.getElementById(
                "timerNumber"
            );

        const timerProgress =
            document.getElementById(
                "timerProgress"
            );

        const downloadButton =
            document.getElementById(
                "downloadButton"
            );


        /* =========================================
           URL HINT
           ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const hintEnabled =
            params.get("hint") === "true";


        if (hintEnabled) {

            document.body.classList.add(
                "show-hints"
            );

        }


        /* =========================================
           SECRET CLICK VARIABLES
           ========================================= */

        let clickCount = 0;

        let inactivityTimeout = null;

        let redirectTimeout = null;

        let countdownInterval = null;

        let redirectActive = false;

        let redirectCancelled = false;


        /* =========================================
           IMAGE CLICK
           ========================================= */

        cipherImage.addEventListener(
            "click",
            function () {

                /*
                    Add one click.
                */

                clickCount++;


                /*
                    Restart the inactivity timer
                    every time the image is clicked.
                */

                restartInactivityTimer();


                /*
                    EXACTLY 50 clicks.
    
                    Start the 10 second timer.
                */

                if (
                    clickCount === REQUIRED_CLICKS
                ) {

                    redirectCancelled = false;

                    startRedirectCountdown();

                }


                /*
                    51 OR MORE clicks.
    
                    Cancel the redirect immediately.
    
                    But DO NOT reset clickCount.
    
                    It keeps counting until
                    10 seconds of inactivity.
                */

                else if (
                    clickCount > REQUIRED_CLICKS
                ) {

                    redirectCancelled = true;

                    cancelRedirect();

                }

            }
        );


        /* =========================================
           START REDIRECT COUNTDOWN
           ========================================= */

        function startRedirectCountdown() {

            /*
                Clean up any old timer.
            */

            clearTimeout(
                redirectTimeout
            );

            clearInterval(
                countdownInterval
            );


            redirectActive = true;

            redirectCancelled = false;


            let secondsLeft =
                REDIRECT_SECONDS;


            timerNumber.textContent =
                secondsLeft;


            /*
                Restart progress animation.
            */

            timerProgress.style.animation =
                "none";

            void timerProgress.offsetWidth;

            timerProgress.style.animation =
                "countdownLine 10s linear forwards";


            /*
                Show overlay.
            */

            secretTimer.classList.add(
                "show"
            );


            /*
                Number countdown.
            */

            countdownInterval =
                setInterval(
                    function () {

                        secondsLeft--;


                        if (
                            secondsLeft >= 0
                        ) {

                            timerNumber.textContent =
                                secondsLeft;

                        }


                        if (
                            secondsLeft <= 0
                        ) {

                            clearInterval(
                                countdownInterval
                            );

                        }

                    },
                    1000
                );


            /*
                Redirect after 10 seconds.
    
                It ONLY redirects if the click
                count is still exactly 50.
            */

            redirectTimeout =
                setTimeout(
                    function () {

                        if (
                            redirectActive === true &&
                            redirectCancelled === false &&
                            clickCount === REQUIRED_CLICKS
                        ) {

                            window.location.href =
                                REDIRECT_URL;

                        }

                    },
                    REDIRECT_SECONDS * 1000
                );

        }


        /* =========================================
           CANCEL REDIRECT
           ========================================= */

        function cancelRedirect() {

            redirectActive = false;


            clearTimeout(
                redirectTimeout
            );

            clearInterval(
                countdownInterval
            );


            redirectTimeout = null;

            countdownInterval = null;


            /*
                Hide timer.
            */

            secretTimer.classList.remove(
                "show"
            );


            /*
                Reset visual countdown.
            */

            timerNumber.textContent =
                REDIRECT_SECONDS;


            timerProgress.style.animation =
                "none";

        }


        /* =========================================
           INACTIVITY RESET
           ========================================= */

        function restartInactivityTimer() {

            clearTimeout(
                inactivityTimeout
            );


            inactivityTimeout =
                setTimeout(
                    function () {

                        /*
                            IMPORTANT:
    
                            If exactly 50 clicks
                            and countdown is active,
                            DO NOT reset here.
    
                            The redirect timer is
                            also reaching 10 seconds.
                        */

                        if (
                            redirectActive === true &&
                            clickCount === REQUIRED_CLICKS
                        ) {

                            return;

                        }


                        /*
                            Otherwise after
                            10 seconds with no clicks:
    
                            reset everything.
                        */

                        clickCount = 0;

                        redirectCancelled = false;

                        cancelRedirect();

                    },
                    INACTIVITY_TIME
                );

        }


        /* =========================================
           DOWNLOAD IMAGE
           ========================================= */

        downloadButton.addEventListener(
            "click",
            function () {

                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    "cipher.png";


                link.download =
                    "cipher.png";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );

            }
        );


        /* =========================================
           PREVENT IMAGE DRAG
           ========================================= */

        cipherImage.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();

            }
        );

    </script>


</body>

</html>
