<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System</title>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        html {
            background: #000;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(circle at 50% 20%,
                    #171717 0%,
                    #080808 35%,
                    #020202 65%,
                    #000 100%);

            color: #fff;

            font-family:
                "Courier New",
                Courier,
                monospace;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 45px 20px 70px;

            overflow-x: hidden;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 601px;
            max-width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        /* =========================
           RANDOM IMAGE
        ========================= */

        #randomImage {
            display: block;

            width: 601px;
            height: 509px;
            max-width: 100%;

            object-fit: cover;

            background: #050505;

            border: 1px solid #333;
            border-radius: 3px;

            box-shadow:
                0 0 0 1px #000,
                0 0 25px rgba(255, 255, 255, 0.06),
                0 20px 60px rgba(0, 0, 0, 0.8);

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        /* =========================
           YOUTUBE VIDEO
        ========================= */

        .video-wrapper {
            position: relative;

            width: 601px;
            max-width: 100%;

            height: 338px;

            margin-top: 25px;
        }

        #youtubeVideo {
            display: block;

            width: 100%;
            height: 100%;

            background: #050505;

            border: 1px solid #272727;
            border-radius: 3px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.8);

            outline: none;
        }

        /*
           Transparent cover prevents interaction/right-click
           directly inside the YouTube iframe.
        */

        .video-blocker {
            position: absolute;
            inset: 0;

            z-index: 5;

            background: transparent;
        }

        /* =========================
           PASSWORD INPUT
        ========================= */

        #password {
            width: 340px;
            max-width: 90%;

            height: 50px;

            margin-top: 32px;
            padding: 0 18px;

            background: #050505;
            color: #fff;

            border: 1px solid #3a3a3a;
            border-radius: 3px;

            outline: none;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 15px;
            font-weight: bold;

            letter-spacing: 2px;
            text-align: center;

            user-select: text;
            -webkit-user-select: text;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        #password::-webkit-outer-spin-button,
        #password::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #password[type="number"] {
            -moz-appearance: textfield;
        }

        #password::placeholder {
            color: #555;

            font-size: 12px;
            font-weight: normal;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        #password:focus {
            background: #080808;

            border-color: #aaa;

            box-shadow:
                0 0 0 1px #555,
                0 0 18px rgba(255, 255, 255, 0.1);
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        #submit {
            width: 150px;
            height: 45px;

            margin-top: 14px;

            background: #0b0b0b;
            color: #aaa;

            border: 1px solid #3b3b3b;
            border-radius: 3px;

            font-family:
                "Courier New",
                Courier,
                monospace;

            font-size: 13px;
            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.08s ease;
        }

        #submit:hover {
            background: #fff;
            color: #000;

            border-color: #fff;

            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.25),
                0 0 35px rgba(255, 255, 255, 0.08);
        }

        #submit:active {
            transform: scale(0.96);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            body {
                padding: 20px 12px 50px;
            }

            .container {
                width: 100%;
            }

            #randomImage {
                width: 100%;
                height: auto;

                aspect-ratio: 601 / 509;
            }

            .video-wrapper {
                width: 100%;
                height: auto;

                aspect-ratio: 16 / 9;

                margin-top: 16px;
            }

            #password {
                width: 320px;
                max-width: 92%;

                margin-top: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- RANDOM STOCK PHOTO -->

        <img id="randomImage" alt="Random Image" draggable="false">


        <!-- YOUTUBE VIDEO -->

        <div class="video-wrapper">

            <iframe id="youtubeVideo" allow="autoplay; encrypted-media" allowfullscreen>
            </iframe>

            <div class="video-blocker"></div>

        </div>


        <!-- PASSWORD -->

        <input placeholder="Product of all the prime numbers" id="password" type="number" autocomplete="off">


        <button id="submit">
            submit
        </button>

    </div>


    <script>

        /* =====================================================
           RANDOM STOCK IMAGE
        ===================================================== */

        const randomImageURL =
            "https://picsum.photos/601/509?random=" + Date.now();

        const randomImage =
            document.getElementById("randomImage");

        randomImage.src = randomImageURL;



        /* =====================================================
           YOUTUBE VIDEO
        ===================================================== */

        const youtubeLink =
            "https://youtu.be/SpaknrSdups";


        function getYouTubeID(url) {

            try {

                const parsedURL = new URL(url);


                /* youtube.com/watch?v= */

                if (
                    parsedURL.hostname.includes("youtube.com") &&
                    parsedURL.pathname === "/watch"
                ) {

                    return parsedURL.searchParams.get("v");

                }


                /* youtube.com/shorts/... */

                if (
                    parsedURL.hostname.includes("youtube.com") &&
                    parsedURL.pathname.startsWith("/shorts/")
                ) {

                    return parsedURL.pathname.split("/")[2];

                }


                /* youtube.com/embed/... */

                if (
                    parsedURL.hostname.includes("youtube.com") &&
                    parsedURL.pathname.startsWith("/embed/")
                ) {

                    return parsedURL.pathname.split("/")[2];

                }


                /* youtu.be/... */

                if (parsedURL.hostname === "youtu.be") {

                    return parsedURL.pathname.substring(1);

                }

            }

            catch (error) {

                return null;

            }


            return null;
        }



        /* =====================================================
           AUTOPLAY + LOOP
        ===================================================== */

        const videoID =
            getYouTubeID(youtubeLink);


        if (videoID) {

            const embedURL =

                "https://www.youtube.com/embed/" +

                videoID +

                "?autoplay=1" +

                "&mute=1" +

                "&loop=1" +

                "&playlist=" + videoID +

                "&controls=0" +

                "&disablekb=1" +

                "&rel=0" +

                "&modestbranding=1";


            document.getElementById("youtubeVideo").src =
                embedURL;

        }



        /* =====================================================
           PASSWORD
        ===================================================== */

        const password =
            document.getElementById("password");


        function checkPassword() {

            if (password.value === "278683099") {

                window.location.href =
                    "almost.html";

            }

            else {

                alert("wrong");

            }

        }


        document
            .getElementById("submit")
            .addEventListener(
                "click",
                checkPassword
            );


        password.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            }
        );



        /* =====================================================
           RIGHT CLICK IMAGE = DOWNLOAD
        ===================================================== */

        randomImage.addEventListener(
            "contextmenu",
            async function (event) {

                event.preventDefault();
                event.stopPropagation();


                try {

                    const response =
                        await fetch(randomImage.src);


                    const blob =
                        await response.blob();


                    const blobURL =
                        URL.createObjectURL(blob);


                    const download =
                        document.createElement("a");


                    download.href =
                        blobURL;


                    download.download =
                        "puzzle-image.jpg";


                    document.body.appendChild(
                        download
                    );


                    download.click();

                    download.remove();


                    setTimeout(
                        () => URL.revokeObjectURL(blobURL),
                        1000
                    );

                }

                catch (error) {

                    /*
                       Fallback if browser/server
                       blocks fetch download
                    */

                    const download =
                        document.createElement("a");


                    download.href =
                        randomImage.src;


                    download.download =
                        "puzzle-image.jpg";


                    document.body.appendChild(
                        download
                    );


                    download.click();

                    download.remove();

                }

            }
        );



        /* =====================================================
           DISABLE RIGHT CLICK EVERYWHERE ELSE
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

            }
        );



        /* =====================================================
           STOP DRAGGING
        ===================================================== */

        document.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();

            }
        );



        /* =====================================================
           STOP PAGE TEXT SELECTION

           Password field is still usable.
        ===================================================== */

        document.addEventListener(
            "selectstart",
            function (event) {

                if (
                    event.target !== password
                ) {

                    event.preventDefault();

                }

            }
        );



        /* =====================================================
           BLOCK COMMON BROWSER COMMANDS
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                const key =
                    event.key.toLowerCase();


                /* F12 */

                if (
                    event.key === "F12"
                ) {

                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    return false;

                }



                /* CTRL + SHIFT */

                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    [
                        "i",
                        "j",
                        "c",
                        "k"
                    ].includes(key)
                ) {

                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    return false;

                }



                /* CTRL commands */

                if (
                    event.ctrlKey &&
                    [
                        "u",
                        "s",
                        "p",
                        "o",
                        "h",
                        "j",
                        "d"
                    ].includes(key)
                ) {

                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    return false;

                }



                /* MAC COMMAND equivalents */

                if (
                    event.metaKey &&
                    [
                        "u",
                        "s",
                        "p",
                        "o",
                        "h",
                        "j",
                        "d"
                    ].includes(key)
                ) {

                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    return false;

                }



                /* MAC DEVTOOLS */

                if (
                    event.metaKey &&
                    event.altKey &&
                    [
                        "i",
                        "j",
                        "c"
                    ].includes(key)
                ) {

                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();

                    return false;

                }

            },
            true
        );

    </script>

</body>

</html>
