<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Carefully</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .top-text {
            color: #555;
            font-size: 12px;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 35px;
            font-size: clamp(35px, 7vw, 70px);
            letter-spacing: 3px;
        }

        .question-box {
            border: 1px solid #252525;
            background: #050505;
            padding: 35px;
            margin-bottom: 35px;
        }

        .question {
            font-size: clamp(20px, 3vw, 30px);
            line-height: 1.6;
        }

        .warning {
            margin-top: 20px;
            color: #555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .answer {
            width: 100%;
            min-height: 85px;

            border: 1px solid #333;
            background: #080808;
            color: #ddd;

            padding: 20px 25px;

            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;

            text-align: left;

            cursor: pointer;

            transition: 0.2s;
        }

        .answer:hover {
            border-color: #aaa;
            background: #111;
            color: #fff;

            transform: translateX(6px);
        }

        .answer-letter {
            color: #777;
            font-size: 20px;
            margin-right: 12px;
        }

        /* RESULT */

        #resultScreen {
            display: none;
        }

        .result-label {
            color: #555;
            font-size: 12px;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .result-icon {
            font-size: 90px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: clamp(35px, 6vw, 65px);
            margin-bottom: 20px;
        }

        .result-text {
            color: #aaa;
            font-size: 18px;
            line-height: 1.7;
        }

        .explanation {
            margin-top: 35px;

            padding: 25px;

            border: 1px solid #222;

            color: #666;

            font-size: 14px;
            line-height: 1.8;
        }

        .reveal {
            animation: reveal 0.8s ease;
        }

        @keyframes reveal {
            0% {
                opacity: 0;
                transform: scale(0.7);
                filter: blur(15px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* SCREEN FLASH */

        .flash {
            position: fixed;
            inset: 0;

            background: white;

            opacity: 0;
            pointer-events: none;

            z-index: 999;
        }

        .flash.active {
            animation: flash 0.35s;
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="flash" id="flash"></div>

    <div class="container">


        <!-- =========================
         QUESTION SCREEN
    ========================== -->

        <div id="questionScreen">

            <div class="top-text">
                ONE QUESTION // THREE OUTCOMES
            </div>

            <h1>THINK.</h1>


            <div class="question-box">

                <div class="question">

                    Only ONE answer below can be correct.<br><br>

                    <strong>
                        Which answer correctly describes
                        the other answers?
                    </strong>

                </div>

                <div class="warning">
                    YOUR ANSWER DETERMINES YOUR PRIZE
                </div>

            </div>


            <div class="answers">


                <!-- ANSWER A -->

                <button class="answer" onclick="chooseAnswer('A')">

                    <span class="answer-letter">A.</span>

                    One of the other two answers is correct.

                </button>



                <!-- ANSWER B -->

                <button class="answer" onclick="chooseAnswer('B')">

                    <span class="answer-letter">B.</span>

                    Both of the other two answers are incorrect.

                </button>



                <!-- ANSWER C -->

                <button class="answer" onclick="chooseAnswer('C')">

                    <span class="answer-letter">C.</span>

                    Answer B is incorrect.

                </button>


            </div>

        </div>



        <!-- =========================
         RESULT SCREEN
    ========================== -->

        <div id="resultScreen">

            <div class="result-label">
                YOUR PRIZE
            </div>

            <div class="result-icon" id="resultIcon">
                ?
            </div>

            <div class="result-title" id="resultTitle">
            </div>

            <div class="result-text" id="resultText">
            </div>

            <div class="explanation" id="explanation">
            </div>

        </div>


    </div>


    <script>

        function chooseAnswer(answer) {

            const questionScreen =
                document.getElementById("questionScreen");

            const resultScreen =
                document.getElementById("resultScreen");

            const resultIcon =
                document.getElementById("resultIcon");

            const resultTitle =
                document.getElementById("resultTitle");

            const resultText =
                document.getElementById("resultText");

            const explanation =
                document.getElementById("explanation");

            const flash =
                document.getElementById("flash");


            /* FLASH */

            flash.classList.remove("active");

            void flash.offsetWidth;

            flash.classList.add("active");


            setTimeout(function () {

                questionScreen.style.display = "none";

                resultScreen.style.display = "block";

                resultScreen.classList.add("reveal");


                /* =========================
                   ANSWER A
                   SECOND-BEST PRIZE
                ========================== */

                if (answer === "A") {

                    resultIcon.textContent = "🎁";

                    resultTitle.textContent =
                        "PRIZE 2";

                    resultText.textContent =
                        "Close... but the logic collapses.";

                    explanation.innerHTML =
                        "If A were true, then one of B or C would also have to be true. " +
                        "That would mean more than one answer is correct, which breaks the rule.";

                }


                /* =========================
                   ANSWER B
                   BEST PRIZE
                ========================== */

                else if (answer === "B") {

                    resultIcon.textContent = "🏆";

                    resultTitle.textContent =
                        "PRIZE 1";

                    resultText.textContent =
                        "Correct.";

                    explanation.innerHTML =
                        "If B is true, then A and C are both false.<br><br>" +
                        "That makes B the only correct answer, exactly as required.";

                }


                /* =========================
                   ANSWER C
                   LOWEST PRIZE
                ========================== */

                else if (answer === "C") {

                    resultIcon.textContent = "💀";

                    resultTitle.textContent =
                        "PRIZE 3";

                    resultText.textContent =
                        "You walked directly into it.";

                    explanation.innerHTML =
                        "If C is true, then B is false.<br><br>" +
                        "But B says both A and C are incorrect. " +
                        "Once C becomes true, the statements stop being logically consistent.";

                }

            }, 250);

        }

    </script>

</body>

</html>
