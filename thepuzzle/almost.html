<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE IMPOSSIBLE PUZZLE // FINAL QUESTION</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #020202;
            color: #d7d7d7;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           BACKGROUND
        ========================= */

        #background {
            position: fixed;
            inset: 0;
            z-index: 0;

            background:
                radial-gradient(circle at center,
                    rgba(255, 255, 255, 0.035),
                    transparent 50%),
                #020202;
        }

        #noise {
            position: fixed;
            inset: -50%;
            z-index: 20;
            pointer-events: none;

            opacity: 0.06;

            background-image:
                repeating-radial-gradient(circle at 0 0,
                    transparent 0,
                    #fff 1px,
                    transparent 2px);

            background-size: 5px 5px;

            animation: noiseMove 0.15s steps(2) infinite;
        }

        @keyframes noiseMove {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2%, -1%);
            }

            50% {
                transform: translate(-2%, 2%);
            }

            75% {
                transform: translate(1%, 1%);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        #scanlines {
            position: fixed;
            inset: 0;
            z-index: 21;
            pointer-events: none;

            background:
                repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px,
                    transparent 4px);
        }

        #vignette {
            position: fixed;
            inset: 0;
            z-index: 22;
            pointer-events: none;

            background:
                radial-gradient(circle at center,
                    transparent 35%,
                    rgba(0, 0, 0, 0.35) 65%,
                    rgba(0, 0, 0, 0.9) 100%);
        }

        /* =========================
           MAIN
        ========================= */

        #main {
            position: relative;
            z-index: 10;

            width: min(850px, 90vw);

            text-align: center;
        }

        #status {
            margin-bottom: 25px;

            color: #555;

            font-size: 10px;
            letter-spacing: 0.5em;
        }

        #status span {
            color: #780000;
        }

        h1 {
            margin: 0 0 35px;

            font-size: clamp(42px, 8vw, 90px);
            line-height: 0.95;

            color: #ddd;

            letter-spacing: -0.06em;

            text-shadow:
                0 0 6px rgba(255, 255, 255, 0.15);
        }

        /* =========================
           QUESTION
        ========================= */

        #questionBox {
            position: relative;

            border: 1px solid #262626;

            background: rgba(5, 5, 5, 0.86);

            padding: 32px 30px;

            margin-bottom: 27px;

            box-shadow:
                0 0 45px rgba(255, 255, 255, 0.015);
        }

        #questionNumber {
            margin-bottom: 18px;

            color: #444;

            font-size: 9px;
            letter-spacing: 0.55em;
        }

        #question {
            color: #bbb;

            font-size: clamp(16px, 2.3vw, 22px);

            line-height: 1.8;
        }

        #question strong {
            color: #eee;
            font-weight: normal;
        }

        #warning {
            margin-top: 22px;

            color: #5c0000;

            font-size: 9px;
            letter-spacing: 0.35em;
        }

        /* =========================
           ANSWERS
        ========================= */

        #answers {
            display: flex;
            flex-direction: column;

            gap: 11px;
        }

        .answer {
            position: relative;

            width: 100%;
            min-height: 72px;

            border: 1px solid #292929;

            background: #070707;

            color: #aaa;

            font-family: inherit;

            font-size: 14px;

            line-height: 1.6;

            text-align: left;

            padding: 18px 22px;

            cursor: pointer;

            transition:
                border-color 0.15s,
                color 0.15s,
                background 0.15s,
                transform 0.15s;
        }

        .answer:hover {
            border-color: #6a6a6a;

            background: #0b0b0b;

            color: #eee;

            transform: translateX(5px);
        }

        .answer:active {
            transform: translateX(2px) scale(0.995);
        }

        .letter {
            display: inline-block;

            width: 38px;

            color: #650000;

            font-size: 18px;
        }

        /* =========================
           LOCKING SCREEN
        ========================= */

        #processing {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            background: #000;

            color: #777;

            font-size: 11px;
            letter-spacing: 0.35em;

            text-align: center;
        }

        #processing.show {
            display: flex;
        }

        #processingText::after {
            content: "";

            animation: processingText 1.25s steps(1) forwards;
        }

        @keyframes processingText {

            0% {
                content: "RESPONSE RECEIVED...";
            }

            30% {
                content: "LOCKING ANSWER...";
            }

            60% {
                content: "CALCULATING OUTCOME...";
            }

            85% {
                content: "PRIZE ASSIGNED.";
                color: #aaa;
            }

            100% {
                content: "ACCESSING FINAL NODE...";
                color: #fff;
            }
        }

        /* =========================
           FLASH
        ========================= */

        #flash {
            position: fixed;
            inset: 0;

            z-index: 150;

            background: #fff;

            opacity: 0;

            pointer-events: none;
        }

        .flashActive {
            animation: flashScreen 0.16s linear;
        }

        @keyframes flashScreen {

            0% {
                opacity: 0;
            }

            30% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================
           BOTTOM DETAILS
        ========================= */

        #bottom {
            position: fixed;

            left: 25px;
            bottom: 20px;

            z-index: 11;

            color: #292929;

            font-size: 9px;
            line-height: 1.8;
        }

        #id {
            position: fixed;

            right: 25px;
            top: 20px;

            z-index: 11;

            text-align: right;

            color: #292929;

            font-size: 9px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {

            #questionBox {
                padding: 24px 18px;
            }

            .answer {
                padding: 16px;
                font-size: 12px;
            }

            #bottom {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="background"></div>

    <main id="main">

        <div id="status">
            FINAL NODE:
            <span>ACTIVE</span>
        </div>

        <h1>ONE QUESTION.</h1>

        <div id="questionBox">

            <div id="questionNumber">
                FINAL RESPONSE REQUIRED
            </div>

            <div id="question">

                Only <strong>ONE</strong> answer below can be correct.

                <br><br>

                <strong>
                    Which answer correctly describes
                    the other answers?
                </strong>

            </div>

            <div id="warning">
                YOUR RESPONSE CANNOT BE CHANGED
            </div>

        </div>

        <div id="answers">

            <button class="answer" onclick="chooseAnswer('A')">
                <span class="letter">A.</span>

                One of the other two answers is correct.
            </button>

            <button class="answer" onclick="chooseAnswer('B')">
                <span class="letter">B.</span>

                Both of the other two answers are incorrect.
            </button>

            <button class="answer" onclick="chooseAnswer('C')">
                <span class="letter">C.</span>

                Answer B is incorrect.
            </button>

        </div>

    </main>


    <div id="bottom">
        PUZZLE CHAIN: 99.8% COMPLETE<br>
        RESPONSE LIMIT: 1<br>
        OUTCOME: UNKNOWN
    </div>


    <div id="id">
        CASE 03<br>
        FINAL QUESTION<br>
        001 // RESPONSE
    </div>


    <div id="processing">
        <div id="processingText"></div>
    </div>


    <div id="flash"></div>

    <div id="noise"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>


    <script>

        let answered = false;


        function chooseAnswer(answer) {

            /*
                Stop double clicking.
            */

            if (answered) {
                return;
            }

            answered = true;


            /*
                SAVE THE ANSWER.

                The winner page can read this with:

                localStorage.getItem("impossiblePuzzleAnswer")
            */

            localStorage.setItem(
                "impossiblePuzzleAnswer",
                answer
            );


            /*
                Flash the screen.
            */

            const flash =
                document.getElementById("flash");

            flash.classList.remove("flashActive");

            void flash.offsetWidth;

            flash.classList.add("flashActive");


            /*
                Show processing screen.
            */

            document
                .getElementById("processing")
                .classList
                .add("show");


            /*
                Send the answer to the winner page.

                A:
                winner_with_prize.html?answer=A

                B:
                winner_with_prize.html?answer=B

                C:
                winner_with_prize.html?answer=C
            */

            setTimeout(function () {

                window.location.href =
                    "winner_with_prize.html?answer=" +
                    encodeURIComponent(answer);

            }, 1300);

        }

    </script>

</body>

</html>
