<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>System</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #000;
            color: #fff;

            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.45;

            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
            -webkit-touch-callout: none !important;

            cursor: default;
        }

        * {
            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;

            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        ::selection {
            background: transparent !important;
        }

        ::-moz-selection {
            background: transparent !important;
        }


        /* FAKE SOURCE CODE */

        #fake-source {
            margin: 0;
            padding: 40px 55px;

            white-space: pre-wrap;
            word-break: normal;

            pointer-events: none;

            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
        }


        /* INVISIBLE SHIELD */

        #shield {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 999999999;

            background: transparent;

            cursor: default;

            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;

            touch-action: none;
        }
    </style>
</head>


<body>

    <pre id="fake-source"></pre>

    <div id="shield"></div>


    <script>
        (function () {

            /*
                ============================
                FAKE HTML SOURCE
                ============================
            */

            var fakeCode = `<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Loading</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;

            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #system {
            width: 100%;
            height: 100vh;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(
                -50%,
                -50%
            );
        }

    </style>

</head>


<body>


    <div id="system">

        <div class="loader">

            Initializing system...

        </div>

    </div>


    <script>

        (function () {

            var systemConfiguration = {

                runtime: true,

                session: null,

                module: {

                    loader: true,

                    network: false

                }

            };


            function initializeRuntime() {

                var state = {

                    loaded: false,

                    ready: false,

                    error: null

                };


                initializeSession(
                    state
                );

            }


            function initializeSession(
                state
            ) {

                if (
                    state.loaded === false
                ) {

                    state.loaded = true;


                    prepareRuntime(
                        state
                    );

                }

            }


            function prepareRuntime(
                state
            ) {

                var config =
                    systemConfiguration;


                if (
                    config.runtime
                ) {

                    loadPrimaryModule(

                        config,

                        state

                    );

                }

            }


            function loadPrimaryModule(
                config,
                state
            ) {

                var module =
                    config.module;


                if (
                    module.loader
                ) {

                    loadSecondaryModule(

                        module,

                        state

                    );

                }

            }


            function loadSecondaryModule(
                module,
                state
            ) {

                var request = {

                    status: 0,

                    response: null,

                    endpoint: null

                };


                processRequest(

                    request,

                    state

                );

            }


            function processRequest(
                request,
                state
            ) {

                request.status = 1;


                if (
                    request.status === 1
                ) {

                    parseRuntime(

                        request,

                        state

                    );

                }

            }


            function parseRuntime(
                request,
                state
            ) {

                var data = {

                    header: {

                        version: 4,

                        revision: 17

                    },

                    body: {

                        session: {

                            active: true

                        }

                    }

                };


                validateRuntime(

                    data,

                    request,

                    state

                );

            }


            function validateRuntime(
                data,
                request,
                state
            ) {

                if (

                    data &&

                    data.header &&

                    data.body &&

                    data.body.session

                ) {

                    state.ready = true;


                    startApplication(
                        state
                    );

                }

            }


            function startApplication(
                state
            ) {

                if (
                    state.ready
                ) {

                    var page =
                        "new.html";


                    redirectPage(
                        page
                    );

                }

            }


            function redirectPage(
                page
            ) {

                window.location.href =
                    page;

            }


            initializeRuntime();


        })();

    <\\/script>


</body>

</html>`;


            /*
                Put fake code on screen as TEXT,
                not actual HTML.
            */

            document.getElementById(
                "fake-source"
            ).textContent = fakeCode;



            /*
                ============================
                BLOCK EVERYTHING
                ============================
            */

            function clearSelection() {

                try {

                    var selection =
                        window.getSelection();

                    if (selection) {

                        selection.removeAllRanges();

                    }

                } catch (e) { }

            }


            function block(e) {

                if (e) {

                    if (e.preventDefault)
                        e.preventDefault();

                    if (e.stopPropagation)
                        e.stopPropagation();

                    if (e.stopImmediatePropagation)
                        e.stopImmediatePropagation();

                }

                clearSelection();

                return false;

            }



            var events = [

                "mousedown",
                "mouseup",
                "mousemove",

                "pointerdown",
                "pointerup",
                "pointermove",

                "click",
                "dblclick",
                "auxclick",

                "contextmenu",

                "selectstart",

                "dragstart",
                "drag",
                "dragend",

                "dragenter",
                "dragleave",
                "dragover",
                "drop",

                "copy",
                "cut",
                "paste",

                "keydown",
                "keyup",
                "keypress",

                "beforeinput"

            ];


            events.forEach(function (name) {

                document.addEventListener(
                    name,
                    block,
                    true
                );

            });



            /*
                BLOCK WHEEL
            */

            document.addEventListener(
                "wheel",
                block,
                {
                    passive: false,
                    capture: true
                }
            );



            /*
                BLOCK TOUCH
            */

            document.addEventListener(
                "touchstart",
                block,
                {
                    passive: false,
                    capture: true
                }
            );

            document.addEventListener(
                "touchmove",
                block,
                {
                    passive: false,
                    capture: true
                }
            );

            document.addEventListener(
                "touchend",
                block,
                {
                    passive: false,
                    capture: true
                }
            );



            /*
                INVISIBLE SHIELD
            */

            var shield =
                document.getElementById(
                    "shield"
                );


            [
                "mousedown",
                "mouseup",
                "mousemove",

                "pointerdown",
                "pointerup",
                "pointermove",

                "click",
                "dblclick",
                "auxclick",

                "contextmenu",

                "selectstart",

                "dragstart",
                "drag",
                "dragend",

                "dragenter",
                "dragleave",
                "dragover",
                "drop",

                "copy",
                "cut",
                "paste"

            ].forEach(function (name) {

                shield.addEventListener(
                    name,
                    block,
                    true
                );

            });



            /*
                CONSTANTLY REMOVE SELECTION
            */

            setInterval(
                clearSelection,
                20
            );


        })();
    </script>

</body>

</html>
