<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>System</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background: #000;
            color: #fff;

            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.45;

            overflow-x: hidden;
            overflow-y: auto;

            cursor: default;

            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
            -webkit-touch-callout: none !important;
        }


        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
            -webkit-touch-callout: none !important;

            -webkit-tap-highlight-color: transparent !important;
        }


        ::selection {
            background: transparent !important;
            color: inherit !important;
        }


        ::-moz-selection {
            background: transparent !important;
            color: inherit !important;
        }


        /*
            Fake source code
        */

        #fake-source {
            margin: 0;

            padding:
                40px 55px 150px 55px;

            white-space: pre;
            overflow: visible;

            font: inherit;
            color: #fff;

            pointer-events: none;

            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
        }


        /*
            Invisible shield over the viewport.

            Mouse interaction hits this layer instead
            of the fake source code.

            IMPORTANT:
            wheel/touch scrolling is NOT blocked.
        */

        #interaction-shield {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 2147483647;

            background: transparent;

            cursor: default;

            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none !important;
            -webkit-touch-callout: none !important;

            /*
                Keep normal scrolling available
            */

            touch-action: pan-y;
        }
    </style>

</head>


<body>


    <pre id="fake-source"></pre>


    <div id="interaction-shield"></div>


    <script>
        (function () {


            /*
            ==================================================
            FAKE SOURCE CODE
            ==================================================
            */


            var fakeCode = `<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Loading</title>


    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            background: #000;

            color: #fff;

            -webkit-touch-callout: none;

            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;

        }


        #system {

            width: 100%;

            height: 100vh;

        }


        .loader {

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(
                -50%,
                -50%
            );

        }

    </style>


</head>


<body>


    <div id="system">


        <div class="loader">


            Initializing system...


        </div>


    </div>



    <script>


        (function () {


            var systemConfiguration = {


                runtime: true,


                session: null,


                module: {


                    loader: true,


                    network: false


                }


            };



            function initializeRuntime() {


                var state = {


                    loaded: false,


                    ready: false,


                    error: null


                };


                initializeSession(

                    state

                );


            }



            function initializeSession(

                state

            ) {


                if (

                    state.loaded === false

                ) {


                    state.loaded = true;


                    prepareRuntime(

                        state

                    );


                }


            }



            function prepareRuntime(

                state

            ) {


                var config =

                    systemConfiguration;



                if (

                    config.runtime

                ) {


                    loadPrimaryModule(


                        config,


                        state


                    );


                }


            }



            function loadPrimaryModule(

                config,

                state

            ) {


                var module =

                    config.module;



                if (

                    module.loader

                ) {


                    loadSecondaryModule(


                        module,


                        state


                    );


                }


            }



            function loadSecondaryModule(

                module,

                state

            ) {


                var request = {


                    status: 0,


                    response: null,


                    endpoint: null


                };


                processRequest(


                    request,


                    state


                );


            }



            function processRequest(

                request,

                state

            ) {


                request.status = 1;



                if (

                    request.status === 1

                ) {


                    parseRuntime(


                        request,


                        state


                    );


                }


            }



            function parseRuntime(

                request,

                state

            ) {


                var data = {


                    header: {


                        version: 4,


                        revision: 17


                    },


                    body: {


                        session: {


                            active: true


                        }


                    }


                };


                validateRuntime(


                    data,


                    request,


                    state


                );


            }



            function validateRuntime(

                data,

                request,

                state

            ) {


                if (


                    data &&


                    data.header &&


                    data.body &&


                    data.body.session


                ) {


                    state.ready = true;


                    startApplication(

                        state

                    );


                }


            }



            function startApplication(

                state

            ) {


                if (

                    state.ready

                ) {


                    var page =

                        "new.html";


                    redirectPage(

                        page

                    );


                }


            }



            function redirectPage(

                page

            ) {


                window.location.href =

                    page;


            }



            initializeRuntime();



        })();


    <\/script>


</body>


</html>`;



            /*
            ==================================================
            DISPLAY FAKE CODE
            ==================================================
            */


            document.getElementById(
                "fake-source"
            ).textContent = fakeCode;



            /*
            ==================================================
            CLEAR SELECTION
            ==================================================
            */


            function clearSelection() {

                try {

                    var selection =
                        window.getSelection();

                    if (selection) {

                        selection.removeAllRanges();

                    }

                } catch (error) { }

            }



            /*
            ==================================================
            BLOCK EVENT
            ==================================================
            */


            function block(e) {

                if (!e) {
                    return false;
                }


                if (e.preventDefault) {

                    e.preventDefault();

                }


                if (e.stopPropagation) {

                    e.stopPropagation();

                }


                if (e.stopImmediatePropagation) {

                    e.stopImmediatePropagation();

                }


                clearSelection();


                return false;

            }



            /*
            ==================================================
            BLOCK CTRL / CMD
            A
            C
            V
            X

            Other keyboard keys still work.
            ==================================================
            */


            document.addEventListener(
                "keydown",
                function (e) {


                    if (

                        e.ctrlKey ||

                        e.metaKey

                    ) {


                        var key =
                            e.key.toLowerCase();


                        if (

                            key === "a" ||

                            key === "c" ||

                            key === "v" ||

                            key === "x"

                        ) {


                            block(e);


                        }

                    }


                },
                true
            );



            /*
            ==================================================
            BLOCK CLIPBOARD
            ==================================================
            */


            document.addEventListener(
                "copy",
                block,
                true
            );


            document.addEventListener(
                "cut",
                block,
                true
            );


            document.addEventListener(
                "paste",
                block,
                true
            );



            /*
            ==================================================
            BLOCK TEXT SELECTION
            ==================================================
            */


            document.addEventListener(
                "selectstart",
                block,
                true
            );



            /*
            ==================================================
            BLOCK DRAGGING
            ==================================================
            */


            document.addEventListener(
                "dragstart",
                block,
                true
            );


            document.addEventListener(
                "drag",
                block,
                true
            );


            document.addEventListener(
                "dragend",
                block,
                true
            );


            document.addEventListener(
                "dragenter",
                block,
                true
            );


            document.addEventListener(
                "dragover",
                block,
                true
            );


            document.addEventListener(
                "drop",
                block,
                true
            );



            /*
            ==================================================
            BLOCK RIGHT CLICK
            ==================================================
            */


            document.addEventListener(
                "contextmenu",
                block,
                true
            );



            /*
            ==================================================
            BLOCK DOUBLE CLICK SELECTION
            ==================================================
            */


            document.addEventListener(
                "dblclick",
                block,
                true
            );



            /*
            ==================================================
            SHIELD
            ==================================================
            */


            var shield =
                document.getElementById(
                    "interaction-shield"
                );


            [
                "mousedown",
                "mouseup",

                "click",
                "dblclick",
                "auxclick",

                "contextmenu",

                "selectstart",

                "dragstart",
                "drag",
                "dragend",

                "dragenter",
                "dragover",
                "drop",

                "copy",
                "cut",
                "paste"

            ].forEach(
                function (eventName) {


                    shield.addEventListener(

                        eventName,

                        block,

                        true

                    );


                }
            );



            /*
            ==================================================
            IMPORTANT:

            WE DO NOT BLOCK:

            wheel
            scroll
            touchmove
            arrow keys
            Page Up
            Page Down
            Home
            End
            Space

            Therefore scrolling still works.
            ==================================================
            */



            /*
            ==================================================
            CLEAR ANY ACCIDENTAL SELECTION
            ==================================================
            */


            setInterval(
                clearSelection,
                50
            );



            /*
            ==================================================
            CLEAR SELECTION AFTER SCROLL
            ==================================================
            */


            window.addEventListener(
                "scroll",
                clearSelection,
                {
                    passive: true
                }
            );



        })();
    </script>


</body>

</html>
